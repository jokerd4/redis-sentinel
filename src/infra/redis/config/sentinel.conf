# Redis Sentinel Configuration
port 26379
dir /tmp
protected-mode no

# Hostname resolution support for Docker environments (Redis 6.2+)
sentinel resolve-hostnames yes
sentinel announce-hostnames yes

# Monitor master named 'mymaster' at redis-master:6379 with quorum 2
sentinel monitor mymaster redis-master 6379 2

# Mark master as SDOWN after 3 seconds of missing PING response (tuned for test responsiveness)
sentinel down-after-milliseconds mymaster 3000

# Failover timeout 10 seconds
sentinel failover-timeout mymaster 10000

# How many replicas can be reconfigured in parallel after failover
sentinel parallel-syncs mymaster 1
