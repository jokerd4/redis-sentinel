# Redis 7.2 Configuration for High Availability Cluster
bind 0.0.0.0
protected-mode no
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300
daemonize no
loglevel notice
databases 16

# Replication settings
replica-read-only yes
replica-serve-stale-data yes
repl-diskless-sync yes
repl-diskless-sync-delay 3
repl-diskless-sync-max-replicas 2
repl-ping-replica-period 10
repl-timeout 60
repl-disable-tcp-nodelay no
# Formula: write speed per sec * failover time gap in sec (e.g. 10mb/s * 10s = 100mb)
repl-backlog-size 128mb

client-output-buffer-limit replica 4096mb 1024mb 60

# Memory and persistence
save ""
appendonly no
maxmemory 4096mb
maxmemory-policy allkeys-lru
