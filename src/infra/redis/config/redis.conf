# Network and general
bind 0.0.0.0
protected-mode no
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300
daemonize no
loglevel notice
databases 16
dir /data

# Authentication (must match across all nodes and Sentinel if enabled)
# requirepass "SuperSecretPass123"
# masterauth "SuperSecretPass123"

# Replication
replica-read-only yes
replica-serve-stale-data yes
repl-diskless-sync yes
repl-diskless-sync-delay 3
repl-diskless-sync-max-replicas 2
repl-ping-replica-period 10
repl-timeout 60
repl-disable-tcp-nodelay no
repl-backlog-size 128mb
repl-backlog-ttl 7200
client-output-buffer-limit replica 512mb 128mb 60

# Split-brain protection (uncomment in production with 2+ replicas)
# min-replicas-to-write 1
# min-replicas-max-lag 10

# Memory management
maxmemory 1024mb
maxmemory-policy noeviction

# RDB snapshots
save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb
rdbcompression yes
rdbchecksum yes

# Multi-Part AOF persistence (Redis 7.2)
appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"
appendfsync everysec
aof-use-rdb-preamble yes
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
